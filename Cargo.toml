[package]
name = "ada-steam-update"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Get notified the moment a Steam game you follow ships an update — and see exactly what kind of update it was."
license = "MIT"
repository = "https://github.com/your-name/ada-steam-update"
readme = "README.md"
keywords = ["steam", "updates", "notifications", "gamedev", "egui"]
categories = ["gui", "games"]

[[bin]]
name = "ada-steam-update"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "persistence", "wayland", "x11", "accesskit"] }
egui = "0.36"
egui-phosphor = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
open = "5"
auto-launch = "0.6"
notify-rust = "4"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
anyhow = "1"
urlencoding = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
